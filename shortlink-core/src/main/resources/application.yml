server:
  port: 8080
  undertow:
    threads:
      io: 4
      worker: 64
    buffer-size: 1024
    direct-buffers: true

spring:
  application:
    name: shortlink
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/shortlink?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: shortlink
    password: shortlink123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 3000
      max-lifetime: 600000

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.shortlink: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ShortLink
shortlink:
  base-url: http://localhost:8080
# Cache
shortlink:
  cache:
    local:
      max-size: 10000
      ttl-minutes: 30
    redis:
      key-prefix: "shortlink:"
    bloom:
      enabled: true
      expected-insertions: 100000000
      fpp: 0.001